<!DOCTYPE html>
<html>

<head>
    <title>My Restaurant Menu</title>
    <style>
        body {
            font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            background:rgb(117, 219, 15);
            padding: 30px;
            text-align: left;
        }

        h1 {
            color: rgb(10, 173, 64);
        }

        /* Sibling Selector - styles the paragraph right after h1 */
        h1+p {
            background: rgb(226, 223, 179);
            padding: 10px 20px;
            border-radius: 8px;
            color: rgb(9, 170, 81);
            display: inline-block;
        }

        ul {
            padding: 0;
            margin-top: 20px;
        }

        /* Child Selector - styles only dircet li children of ul */
        ul>li {
            list-style: none;
            font-size: 18px;
            font-weight: bold;
            color: rgb(9, 182, 18);
            padding: 10px 20px;
            margin: 6px auto;
            width: 260px;
            background: cornsilk;
            border-radius: 8px;
            border: 3px solid rgb(12, 182, 26);
        }

        /* nth-child - highlights the 3rd item as Chef's special */
        ul li:nth-child(3) {
            background: palegoldenrod;
            color: rgb(131, 226, 23);
            border: 3px solid gold;
        }

        .desc {
            color: rgb(7, 137, 212);
            margin-top: 20px;
            font-size: 15px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        /* first-letter - makes the first letter big and bold */
        .desc::first-letter {
            font-size: 220%;
            color: rgb(10, 37, 196);
            font-weight: bold;
        }

        .links {
            margin-top: 25px;
        }

        /* Hover Effect - links glow when mouse moves over them */
        a {
            color: rgb(30, 144, 210);
            text-decoration: none;
            font-size: 15px;
            margin: 0 12px;
            padding: 8px 18px;
            border: 2px solid #3058db;
            border-radius: 8px;
        }

        a:hover {
            background: #0627b8;
            color: white;
        }
    </style>
</head>

<body>
    <h1>My Restaurant Menu</h1>
    <p>Once you taste our food your going to want to come back for more.</p>

    <ul>
        <li>Fried Chicken</li>
        <li>Fish Filet with Sauce</li>
        <li>Burger Overload-Most Popular</li>
        <li>Chicken Nuggets</li>
        <li>French Fries</li>
    </ul>

    <p class="desc">You will love everything we have on the menu!</p>

    <div class="links">
        <a href="#">Order Food?</a>
        <a href="#">Request to Resto</a>
    </div>
</body>
