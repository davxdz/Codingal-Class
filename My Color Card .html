<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Color Card</title>

    <style>

        /* Universal Selector - applies to everything on the page */
        * {
            font-size: 20px;
        }

        /* Element Selectors */
        body {
            background-color: rgb(249, 247, 236);
        }

        h1 {
            color: rgb(73, 161, 84);
        }

        h2 {
            color: rgb(171, 44, 185);
        }

        p {
            color: rgb(214, 30, 131);
        }

        /* Class Selector */
        .my-detail {
            color: rgb(10, 107, 233);
            font-weight: bold;
        }

        /* ID Selector */
        #my-card {
            background-color: burlywood;
        }


    </style>
</head>

<body>

    <h1>My Color Card</h1>

    <!-- Inline CSS: Add style="color_____;" inside this p tag -->
     <p style="color: green;"> Hi! this is my very own webpage.</p>

     <div id="my-card">

        <h2>About Me</h2>
        <p class="my-detail"> My name is David</p>
        <p class="my-detail"> My favourite color is green</p>
        <p class="my-detail"> My favorte subject is English</p>
        <p class="my-detail"> My favourite food is pizza</p>

     </div>

     <h2>My Favourite Things</h2>
     <p>My favourite animals are dogs.</p>
     <p>My favourite sport is badminton.</p>
     <p>My favourite movie is Maya and the Three.</p>

     </body>
     </html>
