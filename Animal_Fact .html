<!DOCTYPE html>
<html>
    <head>
        <title>My Animal Fact File</title>
        <style>

            /* Page Background - sets the color and font for the whole page */
            body{
                background-color:cadetblue;
                font-family:Arial, Helvetica, sans-serif;
            }

            /* Box Model - width sets the content area
            padding pushes the text away from the edges
            border draws a visible frame around the fact file
            margin pushes the first file away from the screen edge */
            .fact-file {
                background-color:cornflowerblue;
                color:cadetblue;
                width: 600px;
                padding: 30px;
                border: 12px dashed rgb(105, 14, 133);
                margin: 40px;
            }

            /* Animal Name - cadetblue so it stands out */
            .animal-name {
                color:rgb(7, 97, 100);
                font-size: 22px;
            }

            /* Detail rows - dark text on the light background */
            .detail {
                color:rgb(3, 24, 114);
            }

            /* Cool fact - purple and italic to make it feel special */
            .cool-fact {
                color:rgb(85, 6, 158);
                font-style: italic;
            }
        </style>
    </head>
    <body>

        <div class="fact-file">
            <h2 class="animal-name">Blue Whale</h2>
            <p class="detail">Type: Mammal</p>
            <p class="detail">Lives in: The Deep Ocean</p>
            <p class="detail">Diet: Tiny Shrimp and other small sea creatures.</p>
            <p class="cool-fact">Cool Fact: It is the biggest animal on Earth</p>
            <p class="cool-fact">Cool Fact: A single tongue can weigh as much as an entire adult elephant.</p>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRfbBZ5Gp7gEY1_BEKFDnVpl2SG1wW0MfOH9u1d9GjHjg&s=10" alt="A Blue Whale" width=""
            height="200">
        </div>

        
    </body>
</html>
