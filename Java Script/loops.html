<!DOCTYPE html>
<html>
    <body>
        <h2>JavaScript For Loop</h2>
        <p id="demo"></p>
        <script>
            var fruits = ["Apple", "Banana", "Mango", "Strawberry", "Blueberry", "Melon"];
            var fru = "";
            var i;

            // for (initialization ; condition ; steps)
            for (i = 0; i < fruits.length; i++)
        {
            fru += fruits[i] + "<br>";
        }

        document.getElementById("demo").innerHTML = fru;
        </script>
    </body>
</html>
