<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>My Phone Contact</title>
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
        rel="stylesheet"
        />
        <style>
            body {
                background-color:antiquewhite;
            }
            h1 {
                color:darkslateblue;
            }
            .card-label {
                font-size: 11px;
                color:darkgray;
                text-transform: uppercase;
            }
            pre {
                font-size: 13px;
                color:dimgray;
            }
        </style>
    </head>
    <body class="py-4">
        <div class="container">
            <h1 class="mb-1">My Phone Contract</h1>
            <p class="text-muted mb-4">Introduction to Objects in JavaScript</p>

            <!-- Contact Card -->
             <div class="card shadow-sm mb-3" style="max-width: 400px">
                <div class="card-body">
                    <h5 class="card-title" style="color:darkslateblue">Contact Details</h5>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item">
                            <span class="card-label d-block">Name</span>
                            <strong id="name">-</strong>
                        </li>
                        <li class="list-group-item">
                            <span class="card-label d-block">Phone</span>
                            <strong id="phone">-</strong>
                        </li>
                        <li class="list-group-item">
                            <span class="card-label d-block">School</span>
                            <strong id="school">-</strong>
                        </li>
                        <li class="list-group-item">
                            <span class="card-label d-block">City</span>
                            <strong id="city">-</strong>
                        </li>
                    </ul>
                </div>
             </div>

             <!-- Code Box -->
              <div class="card shadow-sm" style="max-width: 400px">
                <div class="card-body">
                    <h6 style="color:darkslateblue">JavaScript Object Used</h6>
                    <pre id="codeDisplay" class="bg-light p-3 rounded border mb-0"></pre>
                </div>
              </div>
        </div>
        <!--/container -->

        <script>
            // Step 1 - Create the contact object
            var myContact = {
                name: "Carlisle Villalon",
                phone: "63968-29458",
                school: "Infant Jesus Inc",
                city: "Quezon City",
            };

            // Step 2 - Dot notation 
            var nameEl = document.getElementById("name");
            var phoneEl = document.getElementById("phone");
            nameEl.textContent = myContact.name;
            phoneEl.textContent = myContact.phone;

            // Step 3 Bracket notation
            var schoolEl = document.getElementById("school");
                var cityEl = document.getElementById("city");
                schoolEl.textContent = myContact["school"];
                cityEl.textContent = myContact["city"];

                //show the object in code box
                var codeE1 = document.getElementById("codeDisplay");
                codeE1.textContent = 
                "var myContact = {\n" +
                '  name:  "'+myContact.phone +       '",\n' +
                '  phone:  "' + myContact.name + '",\n' +
                '  school:  "' + myContact["school"] + '",\n' +
                '  city:  "' + myContact["city"] + '",\n' +   "};";
        </script>
    </body>
</html>
