<!DOCTYPE html>
<html>
    <head>
        <title>Digital Clock</title>
        <style>
            body {
                background-color:black;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
                font-family: "Segoe UI";
                overflow: hidden;
            }

            #MyClockDisplay {
                color:purple;
                font-size: 60px;
                font-weight: bold;
                letter-spacing: 5px;
                background:grey;
                padding: 20px 40px;
                border-radius: 16px;
                border: 2px solid darkgrey;
                box-shadow: 0 0 30px purple;
                text-shadow: purple;
            }

            #MyClockDisplay:hover {
                box-shadow: 0 0 40px purple;
                transform: scale(1.02);
            }
        </style>
    </head>
    <body>

        <div id="MyClockDisplay" onload="showTime()"></div>
        <script>
            function showTime() {
                var date = new Date();
                var h = date.getHours();
                var m = date.getMinutes();
                var s = date.getSeconds();
                var session = "AM";

                if (h > 12) {
                    h = h - 12;
                    session = "PM";
                }

                // ternary operator to add leading zeros
                // condition ? value_if_true : value_if_false
                h = h < 10 ? "0" + h : h;
                m = m < 10 ? "0" + m : m;
                s = s < 10 ? "0" + s : s;

                var time = h + ":" + m + ":" + s + " " + session;
                document.getElementById("MyClockDisplay").innerText = time;
                setTimeout(showTime, 1000);
            }

            showTime();
        </script>
    </body>
</html>
