<!DOCTYPE html>
<html>

<head>
    <title>My Daily Task Organizer</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" />
    <style>
        body {
            background: white;
        }

        h1,
        h3 {
            color: purple;
        }

        .box {
            background: white;
            color: purple;
        }
    </style>
</head>

<body>
    <div class="container py-4">
        <h1 class="mb-1">My Daily Task Organizer</h1>
        <p class="text-muted mb-4">
            Sort and label your Tasks using JavaScript array methods!
        </p>

        <!-- TOPIC 1 and 2: sort() and reverse() -->
        <div class="card mb-4">
            <div class="card-body">
                <h3 class="card-title">Task Names</h3>
                <button class="btn btn-primary mr-2" onclick="sortAZ()">
                    Sort A to Z
                </button>
                <button class="btn btn-primary" onclick="sortZA()">
                    Sort Z to A
                </button>
                <div id="nameResult" class="box p-3 mt-3 rounded"></div>
            </div>
        </div>

        <!--TOPIC 3: sort() with compare function -->
        <div class="card mb-4">
            <div class="card-body">
                <h3 class="card-title">How Much Mins</h3>
                <button class="btn btn-primary mr-2" onclick="sortMost()">
                    Most Fastest First
                </button>
                <button class="btn btn-primary" onclick="sortLeast()">
                    Least Fastest First
                </button>
                <div id="countResult" class="box p-3 mt-3 rounded"></div>
            </div>
        </div>

        <!--TOPIC 4: map() -->
        <div class="card mb-4">
            <div class="card-body">
                <h3 class="card-title">Label Every Task</h3>
                <button class="btn btn-primary mr-2" onclick="addLabel()">
                    Add  Mins Label
                </button>
                <div id="labelResult" class="box p-3 mt-3 rounded"></div>
            </div>
        </div>
    </div>
    <script>
        var task = ["Dishes", "Sweeping", "Laundry", "Trash", "Cooking"]; // TOPIC 1 and 2
        var mins = [5, 10, 30, 3, 20]; // TOPIC 3

        document.getElementById("nameResult").innerHTML = "Songs: " + task;
        document.getElementById("nameResult").innerHTML = "Plays: " + plays;
        document.getElementById("nameResult").innerHTML = "Press the button above!";

        function sortAZ() {
            task.sort();
            document.getElementById("nameResult").innerHTML = "A to Z: " + task;
        }
        function sortZA() {
            task.sort();
            task.reverse();
            document.getElementById("nameResult").innerHTML = "Z to A: " + task;
        }
        function sortMost() {
            mins.sort(function (a, b) { return a - b; }); //compare function
            document.getElementById("countResult").innerHTML = "Most Fastest first: " + mins;
        }
        function sortLeast() {
            mins.sort(function (a, b) { return b - a; });
            document.getElementById("countResult").innerHTML = "Least Fastest first: " + mins;
        }
        function addLabel() {
            var labelledMins = mins.map(function (c) { return c + " mins"; });
            document.getElementById("labelResult").innerHTML = "Labelled: " + labelledMins;
        }
    </script>
</body>

</html>
