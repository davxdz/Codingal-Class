<!DOCTYPE html>
<html>

<head>
    <title>My Daily Task Organizer</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" />
    <style>
        body {
            background: white;
        }

        h1,
        h3 {
            color: purple;
        }

        .box {
            background: white;
            color: purple;
        }
    </style>
</head>

<body>
    <div class="container py-4">
        <h1 class="mb-1">My Daily Task Organizer</h1>
        <p class="text-muted mb-4">
            Sort and your Daily Tasks using JavaScript array methods!
        </p>

        <!-- TOPIC 1 and 2: sort() and reverse() -->
        <div class="card mb-4">
            <div class="card-body">
                <h3 class="card-title">Task names</h3>
                <button class="btn btn-primary mr-2" onclick="sortAZ()">
                    Sort A to Z
                </button>
                <button class="btn btn-primary" onclick="sortZA()">
                    Sort Z to A
                </button>
                <div id="nameResult" class="box p-3 mt-3 rounded"></div>
            </div>
        </div>

        <!--TOPIC 3: sort() with compare function -->
        <div class="card mb-4">
            <div class="card-body">
                <h3 class="card-title">Amount it Takes</h3>
                <button class="btn btn-primary mr-2" onclick="sortLeast()">
                    Least Fastest First
                </button>
                <button class="btn btn-primary" onclick="sortMost()">
                    Most Fastest First
                </button>
                <div id="countResult" class="box p-3 mt-3 rounded"></div>
            </div>
        </div>

        <!--TOPIC 4: map() -->
        <div class="card mb-4">
            <div class="card-body">
                <h3 class="card-title">Label Every Daily Task</h3>
                <button class="btn btn-primary mr-2" onclick="addLabel()">
                    Add minutes Label
                </button>
                <div id="labelResult" class="box p-3 mt-3 rounded"></div>
            </div>
        </div>
    </div>
    <script>
        var tasks = ["Dishes", "Sweep", "Eat", "Bath", "Play"]; // TOPIC 1 and 2
        var plays = [310, 67, 170, 125, 250]; // TOPIC 3

        document.getElementById("nameResult").innerHTML = "Task: " + Task;
        document.getElementById("nameResult").innerHTML = "Plays: " + plays;
        document.getElementById("nameResult").innerHTML = "Press the button above!";

        function sortAZ() {
            songs.sort();
            document.getElementById("nameResult").innerHTML = "A to Z: " + task;
        }
        function sortZA() {
            songs.sort();
            songs.reverse();
            document.getElementById("nameResult").innerHTML = "Z to A: " + task;
        }
        function sortLeast() {
            plays.sort(function (a, b) { return a - b; }); //compare function
            document.getElementById("countResult").innerHTML = "Least  first: " + plays;
        }
        function sortMost() {
            plays.sort(function (a, b) { return b - a; });
            document.getElementById("countResult").innerHTML = "Most played first: " + plays;
        }
        function addLabel() {
            var labelledPlays = plays.map(function (c) { return c + " plays"; });
            document.getElementById("labelResult").innerHTML = "Labelled: " + labelledPlays;
        }
    </script>
</body>

</html>
