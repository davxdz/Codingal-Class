<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: white;
            text-align: center;
            padding: 30px;
        }

        h1 {
            color:darkviolet;
        }

        input {
            padding: 8px;
            margin: 5px;
            border: 2px solid darkviolet;
            border-radius: 6px;
            width: 220px;
        }

        button {
            background: darkviolet;
            color: white;
            padding: 10px 25px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }

        #timer {
            color: darkgrey;
        }
    </style>
</head>

<body>
    <h1>Event Registration Form</h1>
    <p>Fill In The Form To Register for the School Event And Generate Your Pass Number!</p>

    <input type="text" id="name" placeholder="Your name" required /><br />
    <p id="msg-name"></p>

    <input type="number" id="con" placeholder="Contact Info" /><br />
    <p id="msg-con"></p>

    <button onclick="checkForm()">Generate</button>
    <p id="result"></p>
    <p id="timer"></p>

    <script>
        var seconds = 0;
        setInterval(function () {
            seconds = seconds + 1;
            document.getElementById("timer").textContent =
                "Your have been here for " + seconds + " seconds!";
        }, 1000);

        function checkForm() {
            var name = document.getElementById("name").value;
            var guess = document.getElementById("con").value;
            var ok = true;

            if (name == "") {
                document.getElementById("msg-name").textContent =
                    "Please enter your name!";
                document.getElementById("msg-name").style.color = "red";
                ok = false;
            } else {
                document.getElementById("msg-name").textContent = "Name Submitted!";
                document.getElementById("msg-name").style.color = "green";
            }

            if (guess == "") {
                document.getElementById("msg-con").textContent =
                    "Please enter your Correct Contact Info!";
                document.getElementById("msg-con").style.color = "red";
                ok = false;
            } else {
                document.getElementById("msg-con").textContent = "Contact Info Submitted";
                document.getElementById("msg-con").style.color = "green";
            }

            if (ok == true) {
                var lucky = Math.floor(Math.random() * 5) + 1;
                    document.getElementById("result").textContent =
                     "! Your pass number is " + lucky + "!";
                    document.getElementById("result").style.color = "darkviolet";
                }
                }
            
    </script>
</body>
</html>
