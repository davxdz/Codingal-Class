<!DOCTYPE html>
<html>
    <body>

        <h2>JavaScript Statements</h2>

        <p>A <b>JavaScript Program</b> is a list of <mark>statements</mark> to be executed by a computer.</p>

        <p id="demo"></p>

        <script>
            var a, b, c; // Statement 1
            a = 5; // Statement 2
            b = 6; // Statement 3
            c = a + b; //Statement 4

            document.getElementById("demo").innerHTML = "The value of c is " + c + ".";
        </script>

    </body>
</html>
