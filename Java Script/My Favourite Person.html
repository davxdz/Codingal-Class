<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>My Favorite Person</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
        rel="stylesheet" />
    <style>
        body {
            background-color:khaki;
        }

        h1 {
            color:darkolivegreen;
        }

        .card-label {
            font-size: 11px;
            color: darkgray;
            text-transform: uppercase;
        }

        pre {
            font-size: 13px;
            color: dimgray;
        }
    </style>
</head>

<body class="py-4">
    <div class="container">
        <h1 class="mb-1">My Favorite Person</h1>
        <p class="text-muted mb-4">Introduction to my Favorite Person</p>

        <!-- Contact Card -->
        <div class="card shadow-sm mb-3" style="max-width: 400px">
            <div class="card-body">
                <h5 class="card-title" style="color:darkolivegreen">Contact Details</h5>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item">
                        <span class="card-label d-block">Name</span>
                        <strong id="name">-</strong>
                    </li>
                    <li class="list-group-item">
                        <span class="card-label d-block">Phone</span>
                        <strong id="phone">-</strong>
                    </li>
                    <li class="list-group-item">
                        <span class="card-label d-block">School</span>
                        <strong id="school">-</strong>
                    </li>
                    <li class="list-group-item">
                        <span class="card-label d-block">City</span>
                        <strong id="city">-</strong>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Code Box -->
        <div class="card shadow-sm" style="max-width: 400px">
            <div class="card-body">
                <h6 style="color:darkolivegreen">JavaScript Object Used</h6>
                <pre id="codeDisplay" class="bg-light p-3 rounded border mb-0"></pre>
            </div>
        </div>
    </div>
    <!--/container -->

    <script>
        // Step 1 - Create the contact object
        var myContact = {
            name: "Canary Alcober",
            phone: "63940-682-7927",
            school: "Infant Jesus Inc",
            city: "Quezon City",
        };

        // Step 2 - Dot notation 
        var nameEl = document.getElementById("name");
        var phoneEl = document.getElementById("phone");
        nameEl.textContent = myContact.name;
        phoneEl.textContent = myContact.phone;

        // Step 3 Bracket notation
        var schoolEl = document.getElementById("school");
        var cityEl = document.getElementById("city");
        schoolEl.textContent = myContact["school"];
        cityEl.textContent = myContact["city"];

        //show the object in code box
        var codeE1 = document.getElementById("codeDisplay");
        codeE1.textContent =
            "var myContact = {\n" +
            '  name:  "' + myContact.name + '",\n' +
            '  phone:  "' + myContact.phone + '",\n' +
            '  school:  "' + myContact["school"] + '",\n' +
            '  city:  "' + myContact["city"] + '",\n' + "};";
    </script>
</body>

</html>
