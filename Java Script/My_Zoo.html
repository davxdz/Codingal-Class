<!DOCTYPE html>
<html>
    <head>
        <title>My Zoo</title>
        <style>
            body {
                font-family:Arial, Helvetica, sans-serif;
                background: khaki;
                text-align: center;
                padding: 30px;
            }

            h1 {
                color:goldenrod;
            }

            #zoo {
                border: 2px dashed goldenrod;
                width: 300px;
                margin: 16px auto;
                padding: 12px;
                border-radius: 10px;
                background:ivory;
            }

            .zone {
                border: 1px dashed goldenrod;
                margin: 6px 0;
                padding: 8px 12px;
                border-radius: 6px;
                text-align: left;
            }

            button {
                background:goldenrod;
                color:white;
                padding: 10px 24px;
                border: none;
                border-radius: 20px;
                cursor: pointer;
            }
        </style>
    </head>
    <body>

        <h1>My Zoo</h1>
        <p>Use JavaScript and the DOM to add animals to each cage!</p>

        <!--
        DOm Tree: zoo is the parent element node.
        Zone dives are child element nodes. Animal names inside each span are text nodes.
        -->
        <div id="zoo">
            <div class="zone">Zone 1: <span id="zone1"></span></div>
            <div class="zone">Zone 2: <span id="zone2"></span></div>
            <div class="zone">Zone 3: <span id="zone3"></span></div>
            <div class="zone">Total Animals: <span id="total"></span></div>
        </div>

        <br>

        <button onclick="openZoo()">Open the Zoo!</button>

        <p id="zoo-status"></p>

        <script>

            function openZoo() {

                /* Task 1 Add your first animal to Zone 1 */
                document.getElementById("zone1").innerHTML = "Tiger";

                /* Task 2 Add your second animal to Zone 2 */
                document.getElementById("zone2").innerHTML = "Snow Leopard";

                /* Task 3 Add your third animal to Zone 3 */
                document.getElementById("zone3").innerHTML = "Eagle";

                /* Task 4 Show the total number of animals */
                document.getElementById("total").innerHTML = "3";

                /* Task 5 Change the zoo background color */
                document.getElementById("zoo").style.backgroundColor = "gold";

                /* Task 6 Use the document object to show the page title */
                document.getElementById("zoo-status").innerHTML = document.title + " is now open!";
            }
        </script>
    </body>
</html>
