<!DOCTYPE html>
<html>

<head>
    <title>My Superhero Cards</title>
    <style>
        body {
            font-family: Arial;
            background: beige;
            padding: 30px;
            text-align: center;
        }

        h1 {
            color: royalblue;
        }

        p {
            color: dimgray;
            font-weight: bold;
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
        }

        .card {
            background: khaki;
            border: 3px solid royalblue;
            border-radius: 12px;
            padding: 20px;
            width: 200px;
        }

        .hero-name {
            font-size: 22px;
            font-weight: bold;
            color: dimgray;
        }

        .hero-fact {
            color: dimgray;
            margin-top: 10px;
            font-size: 14px;
        }

        button {
            background: royalblue;
            color: white;
            border: 4px solid khaki;
            padding: 12px 28px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <h1>My Superhero Cards</h1>
    <p>Use a JavaScript class to build superhero cards!</p>
    <button onclick="showHero()">Show Heroes!</button>
    <div class="cards">
        <div id="card1"></div>
        <div id="card2"></div>
        <div id="card3"></div>
    </div>
    <script>
        class Hero {
            constructor(name, fact) {
                this.name = name;
                this.fact = fact;
            }
            describe() {
                return this.name + ": " + this.fact;
            }
        }

        function showHero() {
            let p1 = new Hero("SpiderMan", "Fast and Sneaky");
            let p2 = new Hero("Thor", "The God of Thunder");
            let p3 = new Hero("IronMan", "The Tech Genius");

            document.getElementById("card1").innerHTML =
                "<div class='card'><div class='hero-name'>" +
                p1.name +
                "</div>" +
                "<div class='hero-fact'>" +
                p1.describe() +
                "</div></div>";

            document.getElementById("card2").innerHTML =
                "<div class='card'><div class='hero-name'>" +
                p2.name +
                "</div>" +
                "<div class='hero-fact'>" +
                p2.describe() +
                "</div></div>";

            document.getElementById("card3").innerHTML =
                "<div class='card'><div class='hero-name'>" +
                p3.name +
                "</div>" +
                "<div class='hero-fact'>" +
                p3.describe() +
                "</div></div>";
        }
    </script>
</body>
</html>
