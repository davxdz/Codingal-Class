<!DOCTYPE html>
<html>
    <body>
        <h2>JavaScript String Methods</h2>
        <p>Basic Methods</p>
        <script>
            var str = "AwEsOmE";
            document.write("<br>Uppercase: ");
            document.write(str.toUpperCase());

            document.write("<br>Lowercase: ")
            document.write(str.toLowerCase());

            document.write("<br>Does start with i? ");
            document.write(str.startsWith('A'));

            // Test Method -> returns true or false
            var str1 = "I learnt about python";
            var test_str = new RegExp("python");
            var res = test_str.test(str1);
            document.write("<br>Does str1 contain test? ");
            document.write(res);

        </script>
    </body>
</html>
