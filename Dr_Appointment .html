<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Doctors Appointment</title>
</head>

<body>

    <h1>My Doctors Appointment</h1>
    <p>Fill in the form below to book your appointment!</p>
    <hr>

    <form>

        <fieldset>
            <legend>Personal Details</legend>

            <label>Your Name</label><br>
            <input type="text" id="name" placeholder="Enter your Full name"> <br><br>

            <label>Patient Id</label><br>
            <input type="password" id="pid" placeholder="Your Personal Patient ID"><br><br>

            <label>Your Address</label><br>
            <textarea id="address" rows="2" cols="30" placeholder="e.g Phase 4 ER San Isidro..."></textarea><br>

            <label>Your Contact Number</label><br>
            <input type="number" id="num"><br>

            <label>Date of Birth</label><br>
            <input type="date" id="dob"><br>

        </fieldset>

        <br>

        <fieldset>
            <legend>Your Visit</legend>

            <label>Choose Your Doctor</label><br>
            <select id="doctor">
                <option value="">-- Select a Doctor --</option>
                <option value="Dr-Ray"> Dr Ray - General</option>
                <option value="Dr-Lee">Dr Lee - Teeth</option>
                <option value="Dr-Sam">Dr Sam - Eyes</option>
            </select><br><br>

            <label>Why Are You Visiting?</label><br>
            <input type="radio" name="reason" value="fever"> Fever<br>
            <input type="radio" name="reason" value="cold"> Cold<br>
            <input type="radio" name="reason" value="checkup"> Checkup<br>
            <input type="radio" name="reason" value="tooth"> Tooth Pain<br><br>

            <label>Medical History</label><br>
            <textarea id="mh" rows="2" cols="33" placeholder="e.g Im Currently Taking..."></textarea><br>

            <label>Any notes for your doctor?</label><br>
            <textarea id="notes" rows="3" cols="35" placeholder="e.g Ive had fever for the past 3 days"></textarea>

        </fieldset>

        <br>

        <fieldset>
            <legend>Preferred Visit Day</legend>
            <input type="checkbox" value="mon"> Monday<br>
            <input type="checkbox" value="tue"> Tuesday<br>
            <input type="checkbox" value="wed"> Wednesday<br>
            <input type="checkbox" value="thu"> Thursday<br>
            <input type="checkbox" value="fri"> Friday<br>
            <input type="checkbox" value="sat"> Saturday<br>
            <input type="checkbox" value="Sun"> Sunday<br>

        </fieldset>

        <br>
        <input type="submit" value="Book My Appointment">

    </form>

    </body>
    </html>
